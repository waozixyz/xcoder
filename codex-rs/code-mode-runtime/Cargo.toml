[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-runtime"
version.workspace = true
build = "build.rs"

[lib]
doctest = false
name = "codex_code_mode_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true, optional = true }
codex-code-mode-protocol = { workspace = true }
codex-plugin-host = { workspace = true, optional = true }
codex-protocol = { workspace = true }
codex-utils-audio = { workspace = true }
codex-utils-output-truncation = { workspace = true }
codex-utils-string = { workspace = true }
deno_core_icudata = { workspace = true, optional = true }
futures = { workspace = true, features = ["executor", "std"] }
opentelemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "process", "net", "io-util", "fs"] }
tokio-util = { workspace = true, features = ["codec", "compat", "rt"] }
tracing = { workspace = true }
v8 = { workspace = true, features = ["v8_enable_sandbox"], optional = true }
libc = { workspace = true }
tempfile = { workspace = true }

[features]
# JavaScript UI plugins are independent of tool execution and opt in separately.
ui = ["dep:v8", "dep:deno_core_icudata", "dep:codex-plugin-host", "dep:base64"]

[build-dependencies]
cc = "1"

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
